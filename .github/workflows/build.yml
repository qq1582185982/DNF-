name: build

run-name: build (${{ github.ref_name }} @ ${{ github.sha }})

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  server-build:
    name: Server build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: 服务器源码
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build server
        run: |
          chmod +x build.sh
          ./build.sh static
          file ./dnf-tunnel-server

      - name: Write server build info
        run: |
          cat > build-info.txt <<EOF
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          artifact=dnf-tunnel-server
          EOF

      - name: Upload server artifact
        uses: actions/upload-artifact@v6
        with:
          name: dnf-tunnel-server-static-${{ github.run_number }}
          path: |
            服务器源码/dnf-tunnel-server
            服务器源码/config.json
            服务器源码/build-info.txt

  linux-client-build:
    name: Linux client build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: linux客户端源码
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build linux client
        run: |
          chmod +x build.sh
          ./build.sh static
          file ./dnf-linux-client

      - name: Write linux client build info
        run: |
          cat > build-info.txt <<EOF
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          artifact=dnf-linux-client
          EOF

      - name: Upload linux client artifact
        uses: actions/upload-artifact@v6
        with:
          name: dnf-linux-client-static-${{ github.run_number }}
          path: |
            linux客户端源码/dnf-linux-client
            linux客户端源码/dnf-linux-client.conf.example
            linux客户端源码/run.sh
            linux客户端源码/install.sh
            linux客户端源码/dnf-linux-client@.service
            linux客户端源码/build-info.txt

  android-client-build:
    name: Android client build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android客户端源码
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Write embedded Android config
        env:
          ANDROID_CONFIG_API_HOST: ${{ secrets.ANDROID_CONFIG_API_HOST }}
          ANDROID_CONFIG_API_PORT: ${{ secrets.ANDROID_CONFIG_API_PORT }}
          ANDROID_SERVER_KEY: ${{ secrets.ANDROID_SERVER_KEY }}
          ANDROID_CLIENT_ID: ${{ secrets.ANDROID_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          host = os.environ.get("ANDROID_CONFIG_API_HOST", "").strip()
          port_text = os.environ.get("ANDROID_CONFIG_API_PORT", "").strip()
          server_key = os.environ.get("ANDROID_SERVER_KEY", "").strip() or "1"
          client_id = os.environ.get("ANDROID_CLIENT_ID", "").strip()

          if not host:
              print("::error::Missing repository secret ANDROID_CONFIG_API_HOST", file=sys.stderr)
              sys.exit(1)
          try:
              port = int(port_text)
          except ValueError:
              print("::error::ANDROID_CONFIG_API_PORT must be a number from 1 to 65535", file=sys.stderr)
              sys.exit(1)
          if port < 1 or port > 65535:
              print("::error::ANDROID_CONFIG_API_PORT must be between 1 and 65535", file=sys.stderr)
              sys.exit(1)

          config = {
              "config_api_url": host,
              "config_api_port": port,
              "server_key": server_key,
              "client_id": client_id,
          }
          path = pathlib.Path("app/src/main/assets/dnf_android_config.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Embedded Android config written from GitHub Actions secrets.")
          PY

      - name: Build Android debug APK
        run: gradle assembleDebug --no-daemon

      - name: Write android build info
        run: |
          cat > build-info.txt <<EOF
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          artifact=dnf-android-client
          variant=debug
          config_source=github_actions_secrets
          EOF

      - name: Upload android artifact
        uses: actions/upload-artifact@v6
        with:
          name: dnf-android-client-debug-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android客户端源码/app/build/outputs/apk/debug/app-debug.apk
            android客户端源码/build-info.txt

  windows-client:
    name: Windows client build
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: 客户端源码
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Download Wintun runtime
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $zipPath = Join-Path $env:TEMP "wintun-0.14.1.zip"
          $extractPath = Join-Path $env:TEMP "wintun-0.14.1"
          $fallbackDllPath = Join-Path (Get-Location) "wintun.dll"
          $amd64DllPath = Join-Path (Get-Location) "wintun-amd64.dll"
          $x86DllPath = Join-Path (Get-Location) "wintun-x86.dll"
          $maxAttempts = 4
          $downloadSucceeded = $false
          $lastErrorMessage = ""

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (Test-Path $zipPath) {
                Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
              }
              if (Test-Path $extractPath) {
                Remove-Item $extractPath -Recurse -Force
              }

              Write-Host "Downloading Wintun runtime, attempt $attempt/$maxAttempts"
              Invoke-WebRequest -Uri $url -OutFile $zipPath -TimeoutSec 60
              Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

              $amd64SourcePath = Get-ChildItem -Path $extractPath -Recurse -Filter wintun.dll |
                Where-Object { $_.FullName -match '[\\\\/]amd64[\\\\/]' } |
                Select-Object -First 1 -ExpandProperty FullName
              $x86SourcePath = Get-ChildItem -Path $extractPath -Recurse -Filter wintun.dll |
                Where-Object { $_.FullName -match '[\\\\/]x86[\\\\/]' } |
                Select-Object -First 1 -ExpandProperty FullName

              if (-not $amd64SourcePath) {
                throw "Failed to locate amd64 wintun.dll in downloaded archive"
              }
              if (-not $x86SourcePath) {
                throw "Failed to locate x86 wintun.dll in downloaded archive"
              }

              Copy-Item $amd64SourcePath $amd64DllPath -Force
              Copy-Item $x86SourcePath $x86DllPath -Force
              Copy-Item $amd64SourcePath $fallbackDllPath -Force
              $downloadSucceeded = $true
              Write-Host "Downloaded and refreshed Wintun runtime from upstream"
              break
            } catch {
              $lastErrorMessage = $_.Exception.Message
              Write-Warning "Wintun download attempt $attempt failed: $lastErrorMessage"
              if ($attempt -lt $maxAttempts) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          if (-not $downloadSucceeded) {
            if (Test-Path $fallbackDllPath) {
              Write-Warning "Upstream download kept failing, falling back to repository Wintun runtime: $fallbackDllPath"
              Copy-Item $fallbackDllPath $amd64DllPath -Force
            } else {
              throw "Upstream download kept failing and no repository fallback wintun.dll was found. Last error: $lastErrorMessage"
            }
          }

      - name: Build multi-server client
        run: .\build-multi-server-client.ps1

      - name: Generate embedded multi-server client header
        run: .\generate-embedded-client-header.ps1

      - name: Build multi-server config injector
        run: .\build-multi-server-injector.ps1

      - name: Build Windows node client x64
        run: |
          Copy-Item ".\wintun-amd64.dll" ".\wintun.dll" -Force
          .\build-windows-node-client.ps1 -Arch x64 -OutputExe "DNF_Windows_Node_Client_v1.0.exe"

      - name: Build Windows node client x86
        run: |
          if (-not (Test-Path ".\wintun-x86.dll")) {
            throw "x86 Wintun runtime is missing; cannot build runnable x86 node client."
          }
          Copy-Item ".\wintun-x86.dll" ".\wintun.dll" -Force
          .\build-windows-node-client.ps1 -Arch x86 -OutputExe "DNF_Windows_Node_Client_v1.0_x86.exe"
          Copy-Item ".\wintun-amd64.dll" ".\wintun.dll" -Force

      - name: Write windows build info
        run: |
          @"
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          artifact=dnf-windows-client
          "@ | Set-Content -Path ".\build-info.txt" -Encoding UTF8

      - name: Stage Windows node artifacts
        run: |
          New-Item -ItemType Directory -Force ".\node-artifact-x64" | Out-Null
          New-Item -ItemType Directory -Force ".\node-artifact-x86" | Out-Null

          Copy-Item ".\DNF_Windows_Node_Client_v1.0.exe" ".\node-artifact-x64\DNF_Windows_Node_Client_v1.0.exe" -Force
          Copy-Item ".\DNF_Windows_Node_Client_v1.0_x86.exe" ".\node-artifact-x86\DNF_Windows_Node_Client_v1.0.exe" -Force

          foreach ($dir in @(".\node-artifact-x64", ".\node-artifact-x86")) {
            Copy-Item ".\dnf-windows-node-client.conf.example" $dir -Force
            Copy-Item ".\run-windows-node-client.cmd" $dir -Force
            Copy-Item ".\WINDOWS_NODE_CLIENT_README.txt" $dir -Force
            Copy-Item ".\LICENSE.wintun.txt" $dir -Force
          }

          @"
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          artifact=dnf-windows-node-client
          arch=x64
          "@ | Set-Content -Path ".\node-artifact-x64\windows-node-build-info.txt" -Encoding UTF8

          @"
          ref_name=${{ github.ref_name }}
          sha=${{ github.sha }}
          run_number=${{ github.run_number }}
          built_at_utc=$((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          artifact=dnf-windows-node-client
          arch=x86
          "@ | Set-Content -Path ".\node-artifact-x86\windows-node-build-info.txt" -Encoding UTF8

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dnf-windows-client-${{ github.run_number }}
          path: |
            客户端源码/DNF_Proxy_Client_MultiServer_v12.4.0.exe
            客户端源码/DNFConfigInjector_MultiServer.exe
            客户端源码/embedded_client_multiserver.h
            客户端源码/build-info.txt

      - name: Upload Windows node x64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: dnf-windows-node-client-x64-${{ github.run_number }}
          path: 客户端源码/node-artifact-x64/

      - name: Upload Windows node x86 artifact
        uses: actions/upload-artifact@v6
        with:
          name: dnf-windows-node-client-x86-${{ github.run_number }}
          path: 客户端源码/node-artifact-x86/
